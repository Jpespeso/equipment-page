<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account | CISTM Equipment Inventory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth">
    <main class="tag">
        <h1>Create your account</h1>
        <p class="lead">New accounts start with the User role. An admin can change it later.</p>

        <div id="message" class="msg" role="status" hidden></div>

        <form id="signup-form" novalidate>
            <div class="field">
                <label for="full_name">Full name</label>
                <input type="text" id="full_name" name="full_name" autocomplete="name" required>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
                <p class="hint">Use at least 8 characters.</p>
            </div>
            <div class="field">
                <label for="confirm">Confirm password</label>
                <input type="password" id="confirm" name="confirm" autocomplete="new-password" required>
            </div>
            <button type="submit" id="signup-button" class="btn btn-block">Create account</button>
        </form>

        <p class="switch">Already have an account? <a href="index.html">Log in</a></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/signup.js"></script>
</body>
</html>
